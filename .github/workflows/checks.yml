name: Checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:render
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-evidence
          path: out/
